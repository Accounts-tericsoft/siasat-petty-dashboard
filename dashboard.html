const SKEY = "siasat_pw_v1";
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
  return new TextDecoder().decode(buf);
}
function show(html){ document.open(); document.write(html); document.close(); }
const form = document.getElementById("lk"), pw = document.getElementById("pw"),
      go = document.getElementById("go"), err = document.getElementById("err");
form.addEventListener("submit", async e => {
  e.preventDefault(); err.hidden = true; go.disabled = true; go.textContent = "Unlocking…";
  try {
    const html = await decrypt(pw.value);
    try { sessionStorage.setItem(SKEY, pw.value); } catch(_) {}
    show(html);
  } catch(_) {
    err.hidden = false; go.disabled = false; go.textContent = "Unlock"; pw.select();
  }
});
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(SKEY); } catch(_) {}
  if (!saved) return;
  try { show(await decrypt(saved)); }
  catch(_) { try { sessionStorage.removeItem(SKEY); } catch(__) {} }
})();
</script>
